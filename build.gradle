plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
   id 'pmd' // Adding for PMD Static Code Analysis
}

repositories {
    mavenCentral()
}


java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

// Configuration for PMD
pmd {
    ignoreFailures = true
    consoleOutput = false
    toolVersion = "7.16.0"
    ruleSets = ["category/java/errorprone.xml", "category/java/bestpractices.xml"] 
}
pmdTest.enabled = false

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

// Task to copy custom HTML into reports/
task copyHtml(type: Copy){
	from 'src/main/html'
	into 'build/reports'
} 

// Task to copy JavaDoc into reports/
task copyDocs(type: Copy, dependsOn: 'javadoc') {
	from 'build/docs/'
	into 'build/reports'
}

// Main reports task
task reports(dependsOn:[ 'build', 'copyHtml', 'copyDocs', 'pmdMain']){
}

dependencies {
    // Added test dependencies for JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Configure the built-in git-publish plugin
gitPublishCopy.dependsOn reports
gitPublish{
    // Set gitHub Repo
    repoUri='git@github.com:ODU-CS351-F26/CS351--ciAsst--bbows001.git'

    // Location the plugin clones repo temporarily
    branch='gh-pages'

    // Grab everything to copy
    contents {
        from'build/reports'
    }
    commitMessage = "Updating webpages at ${new Date().format('yyyy-MM-dd HH:mm:ss')}"
}

// Deployment task 
task deployReports(dependsOn:'gitPublishPush'){}





